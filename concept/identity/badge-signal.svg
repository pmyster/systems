<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>The Signal — Badge</title>

  <defs>
    <linearGradient id="sweep-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fff7f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7fff7f" stop-opacity="0.55"/>
    </linearGradient>
    <path id="signal-arc" d="M 36 168 Q 128 232 220 168" fill="none"/>
  </defs>

  <!-- Backdrop -->
  <circle cx="128" cy="128" r="124" fill="#000000"/>
  <circle cx="128" cy="128" r="120" fill="#001a0c"/>

  <!-- Phosphor green outer ring -->
  <circle cx="128" cy="128" r="118" fill="none" stroke="#7fff7f" stroke-width="2.5"/>

  <!-- CRT range rings -->
  <g fill="none" stroke="#1a4a1a" stroke-width="1">
    <circle cx="128" cy="128" r="100"/>
    <circle cx="128" cy="128" r="75"/>
    <circle cx="128" cy="128" r="50"/>
    <circle cx="128" cy="128" r="25"/>
  </g>

  <!-- Crosshair -->
  <g stroke="#1a4a1a" stroke-width="1">
    <line x1="14" y1="128" x2="242" y2="128"/>
    <line x1="128" y1="14" x2="128" y2="242"/>
  </g>

  <!-- Radar sweep wedge -->
  <path d="M 128 128 L 128 18 A 110 110 0 0 1 224 73 Z" fill="url(#sweep-grad)"/>

  <!-- Sweep leading edge -->
  <line x1="128" y1="128" x2="224" y2="73" stroke="#7fff7f" stroke-width="2.5"/>
  <line x1="128" y1="128" x2="224" y2="73" stroke="#ffffff" stroke-width="0.8" opacity="0.7"/>

  <!-- Contacts -->
  <g>
    <circle cx="90" cy="160" r="4" fill="#7fff7f"/>
    <circle cx="90" cy="160" r="2" fill="#d0ffd0"/>
    <circle cx="160" cy="185" r="4" fill="#7fff7f"/>
    <circle cx="160" cy="185" r="2" fill="#d0ffd0"/>
    <circle cx="195" cy="75" r="5" fill="#d33"/>
    <circle cx="195" cy="75" r="2.5" fill="#ff9595"/>
    <g stroke="#d33" stroke-width="1.3" fill="none" stroke-linecap="round">
      <path d="M 184 64 L 184 70 M 184 64 L 190 64"/>
      <path d="M 206 64 L 206 70 M 206 64 L 200 64"/>
      <path d="M 184 86 L 184 80 M 184 86 L 190 86"/>
      <path d="M 206 86 L 206 80 M 206 86 L 200 86"/>
    </g>
  </g>

  <!-- Center pip -->
  <circle cx="128" cy="128" r="3" fill="#f0c419"/>

  <!-- Amber compass pips -->
  <g fill="#f0c419">
    <circle cx="128" cy="14" r="2.5"/>
    <circle cx="128" cy="242" r="2.5"/>
    <circle cx="14" cy="128" r="2.5"/>
    <circle cx="242" cy="128" r="2.5"/>
  </g>

  <!-- Motto -->
  <text font-family="Georgia, serif" font-size="13" letter-spacing="5" fill="#7fff7f" font-weight="600">
    <textPath href="#signal-arc" startOffset="50%" text-anchor="middle">VIDEMUS PRIMI</textPath>
  </text>
</svg>
