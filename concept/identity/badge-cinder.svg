<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>The Cinder Crown — Badge</title>

  <defs>
    <radialGradient id="ember-glow" cx="50%" cy="78%" r="62%">
      <stop offset="0%" stop-color="#ffa040" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#c43818" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1a0a06" stop-opacity="0"/>
    </radialGradient>
    <path id="cinder-arc" d="M 36 168 Q 128 232 220 168" fill="none"/>
  </defs>

  <!-- Backdrop -->
  <circle cx="128" cy="128" r="124" fill="#0d0604"/>
  <circle cx="128" cy="128" r="120" fill="#1a1410"/>

  <!-- Ember glow -->
  <circle cx="128" cy="155" r="92" fill="url(#ember-glow)"/>

  <!-- Outer ember ring -->
  <circle cx="128" cy="128" r="118" fill="none" stroke="#c43818" stroke-width="3"/>

  <!-- Inner ash ring -->
  <circle cx="128" cy="128" r="108" fill="none" stroke="#4a3024" stroke-width="1"/>

  <!-- Compass ember pips -->
  <g fill="#c43818">
    <circle cx="128" cy="14" r="3"/>
    <circle cx="128" cy="242" r="3"/>
    <circle cx="14" cy="128" r="3"/>
    <circle cx="242" cy="128" r="3"/>
  </g>

  <!-- Five broken spires forming a crown -->
  <g fill="#0a0604" stroke="#2a1810" stroke-width="1.2">
    <polygon points="60,180 72,180 70,130 64,115 58,135"/>
    <polygon points="84,180 100,180 96,100 90,78 82,108"/>
    <polygon points="116,180 140,180 136,58 128,40 124,55 120,76 124,92"/>
    <polygon points="156,180 172,180 174,95 166,76 156,108"/>
    <polygon points="184,180 198,180 196,135 188,118 182,140"/>
  </g>

  <!-- Ember tips -->
  <g fill="#ffa040">
    <circle cx="64" cy="118" r="2.2"/>
    <circle cx="90" cy="82" r="2.8"/>
    <circle cx="128" cy="46" r="3.2"/>
    <circle cx="166" cy="80" r="2.8"/>
    <circle cx="190" cy="122" r="2.2"/>
  </g>
  <g fill="#ffe9c2" opacity="0.75">
    <circle cx="64" cy="118" r="1"/>
    <circle cx="90" cy="82" r="1.3"/>
    <circle cx="128" cy="46" r="1.6"/>
    <circle cx="166" cy="80" r="1.3"/>
    <circle cx="190" cy="122" r="1"/>
  </g>

  <!-- Smoke wisps -->
  <g stroke="#6a5848" stroke-width="1" fill="none" opacity="0.55" stroke-linecap="round">
    <path d="M 64 115 Q 62 105 67 96 Q 71 88 66 80"/>
    <path d="M 90 78 Q 87 68 92 58 Q 95 48 91 40"/>
    <path d="M 128 42 Q 125 32 131 22 Q 135 14 130 8"/>
    <path d="M 166 76 Q 169 66 164 56 Q 161 46 165 38"/>
    <path d="M 190 118 Q 194 110 190 102 Q 186 94 190 88"/>
  </g>

  <!-- Ground line -->
  <line x1="50" y1="180" x2="206" y2="180" stroke="#3a2418" stroke-width="2"/>

  <!-- Motto -->
  <text font-family="Georgia, serif" font-size="13" letter-spacing="5" fill="#c43818" font-weight="600">
    <textPath href="#cinder-arc" startOffset="50%" text-anchor="middle">IGNIS RENATUS</textPath>
  </text>
</svg>
